services:

  php-fpm:
    build: docker
    container_name: 'php-card'
    user: "1000:1000"
    ports:
      - '8000:8000'
    volumes:
      - ./:/app
    working_dir: /app

  nginx:
    image: nginx
    container_name: 'nginx-card'
    working_dir: /app
    ports:
      - '7777:80'
    volumes:
      - ./:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf

  postgres:
    image: postgres:17
    ports:
      - 15432:5432
    container_name: 'postgresql-card'
    working_dir: /app
    restart: always
    environment:
      POSTGRES_DB: 'cards'
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
    volumes:
      - dump:/app/dump
      - postgresql:/var/lib/postgresql/data

###> symfony/mercure-bundle ###
  # Хаб Mercure: события партий в реальном времени (SSE). Публикует приложение, слушают игроки.
  mercure:
    image: dunglas/mercure
    container_name: 'mercure-card'
    restart: unless-stopped
    ports:
      - '3000:80'
    environment:
      # Без HTTPS — для разработки
      SERVER_NAME: ':80'
      # Кому хаб доверяет выдавать токены: claim «iss» токена = MERCURE_JWT_ISSUER в .env
      MERCURE_TRUSTED_ISSUERS: 'http://localhost:7777'
      # Ключ должен совпадать с MERCURE_JWT_SECRET в .env
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # resource_identifier — одна «аудитория» (aud) токенов: приложение публикует по внутреннему адресу
      # (http://mercure), а игроки подписываются по публичному — токены одинаковые
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:7777 http://127.0.0.1:7777
        resource_identifier http://localhost:3000/.well-known/mercure
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
  dump:
  postgresql:
###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
