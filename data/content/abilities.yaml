abilities:
  - type: "Taunt"
    description: "Заставляет врагов атаковать эту карту"

  - type: "Charge"
    description: "Может атаковать в первый ход"

  - type: "Shield"
    description: "Блокирует урон"

  - type: "Flying"
    description: "Не может быть атакован наземными юнитами"

  - type: "Heal"
    description: "Восстанавливает здоровье"

  - type: "Poison"
    description: "Смертельный яд: любой урон от карты убивает существо"

  - type: "Frenzy"
    description: "Увеличивает атаку при получении урона"

  - type: "AoE_Damage"
    description: "Наносит урон всем врагам"

  - type: "Repair"
    description: "Ремонтирует фортификацию"

  - type: "Damage"
    description: "Наносит урон цели (без цели — фортификации противника)"

  # ландшафты
  - type: "Sunny_Day"
    description: "Ландшафт: +атака существам на своей половине поля"

  - type: "Forest"
    description: "Ландшафт: +здоровье эльфам и рождённым лесом на своей половине поля"

  - type: "Dark_Rain"
    description: "Ландшафт: −атака существам на половине поля, где он лежит"

  - type: "Fog"
    description: "Ландшафт: существа на своей половине поля в Укрытии — их нельзя атаковать (кроме Провокации)"

  - type: "Hostile"
    description: "Враждебный ландшафт: ложится на половину поля противника"

  - type: "Duration"
    description: "Ландшафт держится N ходов разыгравшего"

  - type: "Dispel"
    description: "Развеивает ландшафт: свой без цели или выбранный"

  # нейтральные постройки на точках сопряжения — бонус владельцу точки
  - type: "Forge"
    description: "Постройка: в начале хода владельца точки куёт предмет в руку — Кинжал или Щит по очереди"

  - type: "Watchtower"
    description: "Постройка: в начале хода владельца точки — урон фортификации противника"

  - type: "Mana_Well"
    description: "Постройка: в начале хода владельца точки — дополнительная мана"

  # предметы — надеваются на своё существо
  - type: "Equip_Attack"
    description: "Предмет: +атака своему существу, пока оно живо"

  - type: "Equip_Health"
    description: "Предмет: +здоровье своему существу, пока оно живо"
