# Сообщения валидации (домен validators).
# Ключи используются в атрибутах Assert и в invalid_message полей форм.
# Плейсхолдеры {{ min }} / {{ max }} подставляет сам валидатор.
card:
    mana:
        not_null: 'Укажите стоимость маны.'
        not_a_number: 'Стоимость маны должна быть числом.'
        range: 'Стоимость маны должна быть от {{ min }} до {{ max }}.'
    attack:
        not_null: 'Укажите атаку.'
        not_a_number: 'Атака должна быть числом.'
        range: 'Атака должна быть от {{ min }} до {{ max }}.'
    health:
        not_a_number: 'Здоровье должно быть числом.'
        range: 'Здоровье должно быть от {{ min }} до {{ max }}.'
