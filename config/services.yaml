# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    uploads_directory: '%kernel.project_dir%/public/upload/cards'
    # Контент: справочники, карты (папка cards: <тип>/<раса>.yaml), колоды (импорт — app:content:import)
    app.content.dir: '%kernel.project_dir%/data/content'
    app.content.cards_dir: 'cards'

    # Время на ход (секунды): истекло — ход завершается за игрока
    app.game.turn_seconds: 90
    # Срок жизни непрозрачного API-токена (X-Api-Token)
    app.api_token.lifetime: '+30 days'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\ImageUploader:
        arguments:
            $uploadDirectory: '%uploads_directory%'
            $slugger: '@slugger'

    App\Service\ApiTokenService:
        arguments:
            $lifetime: '%app.api_token.lifetime%'

    # API-токен берём из заголовка «X-Api-Token: duel_…» (без слова Bearer — Bearer занят JWT)
    app.security.api_token_extractor:
        class: Symfony\Component\Security\Http\AccessToken\HeaderAccessTokenExtractor
        arguments: ['X-Api-Token', '']

    App\Service\Content\ContentStorage:
        arguments:
            $directory: '%app.content.dir%'
            $cardsDirectory: '%app.content.cards_dir%'

    App\Service\Game\GameService:
        arguments:
            $turnSeconds: '%app.game.turn_seconds%'

    App\DataContent\CardYaml:
        arguments:
            $uploadsDirectory: '%uploads_directory%'

when@test:
    services:
        # Тесты не ходят в настоящий хаб Mercure — события запоминаются (tests/Support/RecordingHub)
        App\Tests\Support\RecordingHub:
            public: true
            arguments:
                $publicUrl: '%env(MERCURE_PUBLIC_URL)%'
                $secret: '%env(MERCURE_JWT_SECRET)%'
                $issuer: '%env(MERCURE_JWT_ISSUER)%'
        Symfony\Component\Mercure\HubInterface: '@App\Tests\Support\RecordingHub'
